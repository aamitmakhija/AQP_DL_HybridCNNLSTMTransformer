# configs/overlays/best_h1_cpu.yaml
# Best H=1 single-horizon config (no station embedding)

dl:
  device: mps          # or "cpu" if you prefer
  batch_size: 64
  lr: 1.5e-4
  weight_decay: 1.0e-4
  epochs: 320
  patience: 20

  optimizer: adamw
  loss: huber
  huber_delta: 1.0

  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 5
    min_lr: 5.0e-6

  amp:
    enabled: false
    dtype: fp16

sequence:
  lookback: 96
  stride: 2
  horizon: [1]

model:
  hybrid:
    impl: hybrid_cnn_transformer

    # CNN front-end
    cnn_channels: [64, 64, 64]
    cnn_kernels:  [3, 3, 3]
    cnn_dropout: 0.12

    # Transformer
    d_model: 192
    nhead: 4
    num_layers: 3
    ff_mult: 4
    attn_dropout: 0.04
    ffn_dropout: 0.12
    posenc: sin
    pool: gap

    # LSTM tail
    use_lstm: true
    lstm_hidden: 160
    lstm_layers: 1
    lstm_dropout: 0.10

    # Critical: no station embedding in the best run
    use_station_embedding: false