# configs/overlays/beat17_gpu.yaml
# One-shot GPU "beat-17" attempt on top of your base yaml

dl:
  device: cuda
  batch_size: 256        # larger batch on GPU
  grad_accum_steps: 1

  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 2.0e-4

  loss: huber
  huber_delta: 4.0

  epochs: 320
  patience: 30

  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 6
    min_lr: 1.0e-6

  amp:
    enabled: true
    dtype: fp16

sequence:
  # keep the proven windowing
  lookback: 96
  stride: 2
  horizon: [1]

model:
  hybrid:
    impl: hybrid_cnn_transformer

    # modest bump vs CPU golden baseline
    cnn_channels: [64, 64, 64]
    cnn_kernels: [7, 5, 3]
    cnn_dropout: 0.15

    d_model: 192
    nhead: 4
    num_layers: 3
    ff_mult: 4
    attn_dropout: 0.08
    ffn_dropout: 0.15

    use_station_embedding: false

    use_lstm: true
    lstm_hidden: 160
    lstm_layers: 1
    lstm_dropout: 0.10

    pool: gap
    posenc: sin
    ln_eps: 1.0e-6