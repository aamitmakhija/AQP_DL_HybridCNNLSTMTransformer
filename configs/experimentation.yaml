# ==================== runtime (Mac/MPS, H=1) ====================
seed: 42


dl:
  amp:
    enabled: true
    dtype: fp16
  device: mps
  batch_size: 64
  num_workers: 2
  prefetch_factor: 2
  pin_memory: false
  persistent_workers: false
  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 2.0e-4
  epochs: 300
  patience: 14
  grad_clip: 0.5
  model_dir: models_mps
  loss: huber
  huber_delta: 4.0
  target_transform: log1p
  clip_target_max: 300
  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 6
    min_lr: 1.0e-5
  amp:
    enabled: false
    dtype: fp16

# ===================== paths =====================
paths:
  data_dir: raw_data
  artifacts_dir: experiments/artifacts
  checkpoints_dir: experiments/checkpoints
  dataset_stream_dir: dataset_stream
  splits_dir: splits
  features_dir: features
  features_scaled_dir: features_scaled_ps
  features_locked_dir: features_locked
  keep_config: configs/keep.yaml
  reports_dir: reports

# ================= CSV reading ==================
read_csv:
  engine_preference: [pyarrow, python, c]
  kwargs:
    dtype: {}
    keep_default_na: true

data_files:
  air:
    path: airquality.csv
    read_csv: { kwargs: {} }
  met:
    path: meteorology.csv
    read_csv: { kwargs: {} }
  station: station.csv
  district: district.csv
  city: city.csv
  forecast:
    path: weatherforecast.csv
    read_csv: { kwargs: {} }

# =========== canonical schema & headers =========
data:
  id_col: station_id
  time_col: Datetime
  target: PM25_Concentration
  features: [temperature, humidity, pressure, wind_speed, wind_direction]

  headers:
    id: [station_id, Station ID, station, STATION_ID, id, ID]
    time: [Datetime, Time, timestamp, time, TIME]

    airquality:
      station: ["Station ID", station_id, station, STATION_ID]
      time: [Time, Datetime, time, timestamp, TIME]
      pm25: [PM25_Concentration, PM2.5, PM25, pm25, pm25_conc, PM25_Concentration_lag0h]

    meteorology:
      geo: [ID, geo_id, id]
      time: [Time, Datetime, time, timestamp]

    weatherforecast:
      geo: [ID, geo_id, id]
      ftime: ["Forecast Time", ForecastTime, time_forecast, ftime]
      future: ["Future Time", FutureTime, time_future, future_time]
      weather: [Weather, weather]
      up_temperature: ["Up temperature", UpTemperature, up_temperature, temp_high_c, temp_hi]
      bottom_temperature: ["Bottom Temperature", BottomTemperature, bottom_temperature, temp_low_c, temp_lo]
      wind_level: ["Wind Level", WindLevel, wind_level]
      wind_direction: ["Wind Direction", WIND_DIREC, wind_direction, WindDirection]

# ============== missing data handling ================
missing:
  drop_threshold: 0.8
  rolling_mean_hours: 24
  drop_features: [bottom_temperature, frequent]
  impute:
    enabled: true
    ffill_limit: 6
    rolling_window: 24
    median_fallback: true

# ============ station selection ============
station_scope:
  mode: min_rows
  min_rows: 5000

# ================= time split cutoffs =================
split:
  train_end: "2014-12-31"
  val_end: "2015-03-31"
  drop_years: [1970]

# ==================== scaling ========================
scaling:
  type: standard
  per_station: true
  epsilon: 1.0e-8
  output_format: parquet
  meta_file: scaler_params.json
  exclude_columns: [PM25_Concentration, station_id, Datetime, id, district_id, city_id]

# ============== feature engineering ==================
lags:
  enabled: true
  hours: [1, 3, 6, 12, 24, 48]

features:
  lock_enabled: true
  include_groups: ["aq","met","rolling","time"]
  locked_manifest: feature_list.json
  autogenerate_if_missing: true
  rolling_windows: [6, 12, 24, 48, 72, 168]
  lag_hours: [1, 3, 6, 12, 24, 48]
  time_features: { cyclical: true }
  output:
    format: parquet
    features_file: dataset_features.parquet
    features_file_imputed: dataset_features_imputed.parquet
    manifest_file: features_manifest.json
    activate_imputed: true
    activate_mode: overwrite

# ===================== output (for 02_build_stream & readers) =======================
output:
  format: parquet
  split_filenames:
    train: train.parquet
    val:   val.parquet
    test:  test.parquet
  naming:
    pattern: "{key}.{ext}"
  partition_prefix: "station="
  per_station_filename: "data.parquet"

# =====================================================
# Windowing + trainer (H=1 only)
# =====================================================
sequence:
  out_dir: seq
  lookback: 96
  horizon: [1, 3]
  train_split: train
  val_split:   val
  test_split:  test
  stride: 2
  dropna: true
  min_valid_ratio: 0.50
  shard_size: 4000
  dtype: float32
  nan_fill_value: 0.0
  strict_features: true
  check_max_shards: 1
  sample:
    enabled: false

baselines:
  seasonal_period: 168

# ================== model selection & knobs ==================
model:
  hybrid:
    impl: hybrid_cnn_transformer        # or: legacy_hybrid_encoder
    use_station_embedding: true
    station_embed_dim: 16
    cnn_channels: [48, 48, 48]
    cnn_kernels: [7, 5, 3]
    cnn_dropout: 0.15
    d_model: 160
    nhead: 4
    num_layers: 2
    ff_mult: 4
    attn_dropout: 0.05
    ffn_dropout: 0.15
    pool: gap
    posenc: sin
    # LSTM (used only by hybrid_cnn_transformer)
    use_lstm: true
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.10
    ln_eps: 1e-6

# ====================== evaluation ======================
eval:
  metrics: ["rmse", "mae", "smape", "r2"]
  per_station: true
  save_preds: true
  sanitize:
    clamp: { min: null, max: null }
  report_filename: eval_report.json
  preds_filename_pattern: preds_H{H}.csv
  per_station_filename_pattern: per_station_H{H}.csv
  amp: { enabled: false }
  min_valid_ratio: 0.50

# ======================= reports =======================
reports:
  stations_keep_txt: ""
  duplicates_summary: reports/duplicates_summary.json
  write_duplicates_csv: true
  duplicates_csv_dir: reports/dup_rows
  plots_dir: reports/plots
  quick_stats_json: reports/quick_stats.json

#======================CNN ONLY MODEL======================= #

  model:
  hybrid:
    use_lstm: false
    num_layers: 0        # kill Transformer
    cnn_channels: [48, 48, 48]
    cnn_kernels:  [7, 5, 3]


# =====================LSTM ONLY MODEL======================= #

model:
  hybrid:
    # bypass CNN
    cnn_channels: []
    cnn_kernels:  []
    cnn_dropout:  0.0
    # use only LSTM
    use_lstm: true
    num_layers: 0        # kill Transformer


# =====================TRANSFORMER ONLY MODEL======================= #


    model:
  hybrid:
    cnn_channels: []     # bypass CNN
    cnn_kernels:  []
    cnn_dropout:  0.0
    use_lstm: false
    num_layers: 2        # keep Transformer


    #===================D. Hybrid (baseline you have)===================== #

    model:
  hybrid:
    cnn_channels: [48, 48, 48]
    cnn_kernels:  [7, 5, 3]
    use_lstm: true
    num_layers: 2



