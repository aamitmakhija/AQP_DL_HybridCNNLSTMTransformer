dl:
  device: cuda
  amp:
    enabled: true
    dtype: fp16
  batch_size: 192
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  optimizer: adamw
  lr: 1.5e-4            # safer for deeper model
  weight_decay: 1.0e-4
  epochs: 300
  patience: 18
  grad_clip: 0.5
  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 5
    min_lr: 5.0e-6

model:
  hybrid:
    use_station_embedding: false
    cnn_channels: [64, 64, 64]
    cnn_dropout: 0.10
    d_model: 192
    nhead: 6
    num_layers: 3
    ff_mult: 4
    attn_dropout: 0.05
    ffn_dropout: 0.10
    use_lstm: true
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.10